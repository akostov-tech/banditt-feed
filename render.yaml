services:
  - type: web
    name: banditt-feed-proxy
    env: node
    buildCommand: npm install && curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/metalmania/MetalMania-Regular.ttf" -o /usr/local/share/fonts/MetalMania-Regular.ttf && fc-cache -f
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
